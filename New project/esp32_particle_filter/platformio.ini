[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform_packages =
  framework-arduinoespressif32@symlink://.platformio/packages/framework-arduinoespressif32
build_flags =
  -Wall
  -Wextra
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
